name: Setup MoonBit (Unix)
description: Install a pinned MoonBit toolchain without the GitHub-release helper used by setup-moonbit.

inputs:
  version:
    description: Exact MoonBit toolchain/core version.
    required: true

runs:
  using: composite
  steps:
    - name: Install MoonBit
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
