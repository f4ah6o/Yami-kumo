name: Temporary Markdown formatting diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'issues/open/20261007-*.md'
      - '.github/workflows/temporary-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  show-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true
      - name: Show exact Markdown formatting patch
        run: |
          vp check --fix || true
          git diff -- issues/open/20261007-apple-silicon-macos-native-ux-conformance.md issues/open/20261007-linux-native-ux-conformance.md issues/open/20261007-windows-native-ux-conformance.md
