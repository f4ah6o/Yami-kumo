name: Temporary formatting diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test-npm-consumers.mjs'
      - '.github/workflows/temporary-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  show-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true
      - name: Capture exact Vite+ formatter diff
        run: |
          vp check --fix || true
          git diff -- scripts/test-npm-consumers.mjs
