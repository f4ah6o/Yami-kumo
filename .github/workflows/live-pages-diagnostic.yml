name: Live Pages Diagnostic

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Pages response
        env:
          PAGE_URL: https://f4ah6o.github.io/Yami-kumo/
        run: |
          set -euo pipefail

          echo '--- response headers ---'
          curl -fsSIL "$PAGE_URL"

          echo '--- plain index ---'
          plain_html="$(curl -fsSL "$PAGE_URL")"
          printf '%s\n' "$plain_html" | sed -n '1,50p'

          echo '--- cache-busted index ---'
          fresh_html="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL}?diagnostic=${GITHUB_SHA}")"
          printf '%s\n' "$fresh_html" | sed -n '1,50p'

          for label in plain fresh; do
            if [[ "$label" == plain ]]; then
              html="$plain_html"
            else
              html="$fresh_html"
            fi

            script_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)"
            style_path="$(printf '%s' "$html" | grep -oE 'href="[^"]+\.css"' | head -1 | cut -d'"' -f2)"

            echo "--- $label assets ---"
            echo "script=$script_path"
            echo "style=$style_path"

            test -n "$script_path"
            test -n "$style_path"

            curl -fsSIL "https://f4ah6o.github.io${script_path}"
            curl -fsSIL "https://f4ah6o.github.io${style_path}"
          done
