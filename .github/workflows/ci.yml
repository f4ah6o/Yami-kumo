name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true

      - name: Setup Python for inert oracle tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run inert Kumo Button oracle tests
        run: |
          node --check scripts/measure-button-phases.mjs
          node --check scripts/button_phase_evidence.mjs
          node --check tests/button-phase/evidence-storage.test.mjs
          node tests/button-phase/evidence-storage.test.mjs
          python -B tests/button-phase/test_supervisor_inert.py
          node --test tests/button-contract/comparison.test.mjs
          python -B tests/button-contract/test_driver.py

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9

      - name: Build MoonBit parity module
        run: pnpm run moon:build

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp exec tsc --noEmit

      - name: Test
        run: vp test

      - name: Build
        run: vp build

      - name: Verify MoonBit library, generated Kumo contract, and parity gallery
        run: pnpm run build:parity

  windows-moonbit-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9

      - name: Compile and import the MoonBit renderer on Windows
        run: node scripts/check-moonbit-build.mjs
