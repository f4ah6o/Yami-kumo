name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9

      - name: Build MoonBit parity module
        run: pnpm run moon:build

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp exec tsc --noEmit

      - name: Test
        run: vp test

      - name: Build
        run: vp build

      - name: Verify MoonBit library, generated Kumo contract, and parity gallery
        run: pnpm run build:parity
