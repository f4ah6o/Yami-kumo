name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9
      - name: Check shared pure packages on every compiler target
        run: |
          moon check --target all --deny-warn
          moon test ui/core ui/runtime ui/theme examples/shared_counter examples/shared_button_theme --target all --deny-warn
          moon test ui/core ui/runtime ui/theme examples/shared_counter examples/shared_button_theme --target all --deny-warn --release
      - name: Verify common Button theme tokens and generated scoped CSS
        run: pnpm run check:shared-theme
      - name: Verify independent JS and native source consumers
        run: node scripts/check-shared-ui-consumers.mjs _build/shared-ui-consumers
      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and test the keyed DOM adapter
        env:
          SHARED_UI_EVIDENCE_DIR: _build/shared-ui-dom
        run: |
          pnpm run build:shared-ui
          node --test tests/shared-ui/*.test.mjs
      - name: Retain shared UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-evidence
          path: |
            _build/shared-ui-consumers
            _build/shared-ui-dom
            _build/shared-ui/web
          if-no-files-found: error

  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test npm release gates
        run: node --test tests/npm/release.test.mjs
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9
      - name: Check regenerated pnpm lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml
      - name: Install consumer browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Pack and verify isolated consumers
        run: pnpm run test:npm
      - name: Upload packed artifact and consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: yami-kumo-npm-preview
          path: |
            dist/*.tgz
            dist/npm-consumers.json
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.16.1
        with:
          node-version: 'lts'
          run-install: true

      - name: Setup Python for inert oracle tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run inert Kumo Button oracle tests
        run: |
          node --check scripts/measure-button-phases.mjs
          node --check scripts/button_phase_evidence.mjs
          node --check tests/button-phase/evidence-storage.test.mjs
          node tests/button-phase/evidence-storage.test.mjs
          python -B tests/button-phase/test_supervisor_inert.py
          node --test tests/button-contract/comparison.test.mjs
          python -B tests/button-contract/test_driver.py

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9

      - name: Build MoonBit parity module
        run: pnpm run moon:build

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp exec tsc --noEmit

      - name: Test
        run: vp test

      - name: Build
        run: vp build

      - name: Verify MoonBit library, generated Kumo contract, and parity gallery
        run: pnpm run build:parity

  windows-moonbit-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.14+7d59c7ec9
          setup-core: true
          core-version: 0.10.14+7d59c7ec9

      - name: Compile and import the MoonBit renderer on Windows
        run: node scripts/check-moonbit-build.mjs
